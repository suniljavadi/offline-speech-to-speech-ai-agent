name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install "pytest>=8,<9" "numpy>=1.26,<3" "pydantic>=2.7,<3" "fastapi>=0.110,<1" "httpx>=0.27,<1" "streamlit>=1.35,<2" "tzdata>=2024.1"
      - name: Run test suite
        run: python -m pytest -q
