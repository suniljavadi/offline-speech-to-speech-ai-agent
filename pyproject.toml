[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-speech-to-speech-ai-agent"
version = "0.1.0"
description = "Local-first speech capture and transcription services for an offline voice assistant."
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.1,<2",
    "fastapi>=0.110,<1",
    "numpy>=1.26,<3",
    "piper-tts>=1.3,<2",
    "pydantic>=2.7,<3",
    "silero-vad>=6,<7",
    "sounddevice>=0.5,<1",
    "streamlit>=1.35,<2",
    "tzdata>=2024.1",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
